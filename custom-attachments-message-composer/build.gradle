plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "io.getstream.chat.android.customattachmentsv2"
        namespace "io.getstream.chat.android.customattachments"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
}

dependencies {
    // Stream SDK dependency
    implementation "io.getstream:stream-chat-android-ui-components:7.13.0"

    implementation libs.androidxCoreKtx
    implementation libs.androidxActivityKtx
    implementation libs.materialComponents
}
